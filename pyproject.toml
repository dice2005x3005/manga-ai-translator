[project]
name = "manga-ai-translator"
version = "0.1.0"
description = "Desktop app that translates manga from Japanese to English with local AI models."
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.5.4",
    "nvidia-ml-py>=13.615.71",
    "pillow>=12.3.0",
    "platformdirs>=4.13.0",
    "psutil>=7.2.2",
    "pydantic>=2.14.1",
    "rich>=15.0.0",
    "typer>=0.27.3",
]

[project.optional-dependencies]
# PyTorch comes in two mutually exclusive flavors; pick one with `uv sync --extra cpu|cuda`.
cpu = ["torch>=2.14"]
cuda = ["torch>=2.14"]

[project.scripts]
mangat = "manga_ai_translator.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.4",
    "ruff>=0.13",
]

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "cuda" }]]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu126", extra = "cuda" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

# CUDA 12.6 builds still ship kernels for Turing (GTX 16xx, sm_75) and work with older drivers.
[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
